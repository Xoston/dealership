version: '3.8'
services:
  server:
    build: ./server
    ports:
      - "8000:8000"
    volumes:
      - ./server/app:/app
    environment:
      - DATABASE_URL=sqlite:///./dealership.db
      - SECRET_KEY=change-me-in-production
  client:
    build: ./client
    ports:
      - "3000:3000"
    depends_on:
      - server