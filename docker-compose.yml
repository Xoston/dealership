services:
  server:
    build: ./server
    ports:
      - "8001:8000"
    volumes:
      - ./server:/app
    environment:
      - DATABASE_URL=sqlite:///./dealership.db
      - SECRET_KEY=change-me-in-production

  client:
    build: ./client
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app
      - /app/node_modules
    stdin_open: true
    depends_on:
      - server